<!-- new-tx.modal.html — MoneyFlow style -->
<div class="modal-wrapper">
  <!-- Drag handle -->
  <div class="drag-handle-row">
    <div class="drag-handle"></div>
  </div>

  <!-- Top bar -->
  <div class="modal-topbar">
    <button class="modal-close" (click)="close()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <span class="modal-title">Nueva transacción</span>
    <div style="width:36px"></div>
  </div>

  <!-- Type tabs -->
  <div class="type-tabs">
    <button class="type-tab" [class.active-gasto]="form.value.type==='out'" [class.active-ingreso]="false" (click)="form.patchValue({type:'out'})">GASTO</button>
    <button class="type-tab" [class.active-ingreso]="form.value.type==='in'" (click)="form.patchValue({type:'in'})">INGRESO</button>
  </div>

  <div class="modal-scroll">
    <!-- Amount display -->
    <div class="amount-section">
      <div class="amount-label">MONTO</div>
      <div class="amount-display">
        <span class="amount-curr">RD$</span>
        <span class="amount-value" [style.color]="form.value.type==='in' ? 'var(--mf-green)' : 'var(--mf-red)'">
          {{ formattedAmount || '0' }}
        </span>
      </div>
    </div>

    <!-- Fields row -->
    <div class="fields-card" [formGroup]="form">
      <div class="field-row">
        <span class="field-key">Categoría</span>
        <div class="field-val">
          <ion-select formControlName="category" placeholder="Seleccionar" interface="popover" class="field-select" *ngIf="form.value.type==='out'">
            <ion-select-option *ngFor="let c of (categories$ | async)" [value]="c.name">{{ c.emoji }} {{ c.name }}</ion-select-option>
          </ion-select>
          <span class="field-text" *ngIf="form.value.type==='in'" style="color:var(--mf-text3)">Ingreso</span>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--mf-text3)" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="field-divider"></div>
      <div class="field-row">
        <span class="field-key">Método</span>
        <ion-select formControlName="paymentMethod" interface="popover" class="field-select" (ionChange)="onPaymentChange($event)">
          <ion-select-option value="cash">💵 Efectivo</ion-select-option>
          <ion-select-option value="card">💳 Tarjeta</ion-select-option>
        </ion-select>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--mf-text3)" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <ng-container *ngIf="form.value.paymentMethod==='card'">
        <div class="field-divider"></div>
        <div class="field-row">
          <span class="field-key">Tarjeta</span>
          <ion-select formControlName="cardId" placeholder="Seleccionar" interface="popover" class="field-select">
            <ion-select-option *ngFor="let c of (cards$ | async)" [value]="c.id">{{ c.name }}</ion-select-option>
          </ion-select>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--mf-text3)" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </ng-container>
      <div class="field-divider"></div>
      <div class="field-row">
        <span class="field-key">Fecha</span>
        <input type="date" class="date-input" [value]="dateValue" (change)="onDateChange($event)" />
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--mf-text3)" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="field-divider"></div>
      <div class="field-row">
        <span class="field-key">Nota</span>
        <input class="note-input" formControlName="note" placeholder="Descripción opcional..." />
      </div>
    </div>

    <!-- Numpad -->
    <div class="numpad">
      <button class="numpad-key" *ngFor="let k of ['1','2','3','4','5','6','7','8','9','.','0','⌫']" (click)="press(k)">
        {{ k }}
      </button>
    </div>

    <!-- Save button -->
    <button class="save-btn" [disabled]="!canSave" (click)="save()">
      Guardar transacción
    </button>

    <div style="height:24px"></div>
  </div>
</div>
