<!-- categories.modal.html — MoneyFlow Design -->
<div class="modal-handle"></div>

<div class="modal-header">
  <span class="modal-title">Categorías</span>
  <button class="modal-close" (click)="close()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
</div>

<ion-content class="cat-modal-content">
  <div class="cat-body">

    <!-- New category form -->
    <div class="mf-card cat-form" [formGroup]="form">
      <div class="cat-form-title">Nueva categoría</div>
      <div class="cat-form-row">
        <div class="cat-form-group" style="flex:0 0 70px">
          <label class="cat-lbl">Emoji</label>
          <input class="cat-input cat-emoji-inp" formControlName="emoji" placeholder="🗂️" />
        </div>
        <div class="cat-form-group" style="flex:1">
          <label class="cat-lbl">Nombre</label>
          <input class="cat-input" formControlName="name" placeholder="Ej.: Supermercado" />
        </div>
      </div>
      <button class="cat-add-btn" [disabled]="form.invalid || saving" (click)="add()">
        {{ saving ? 'Guardando…' : '+ Agregar categoría' }}
      </button>
    </div>

    <!-- Categories list -->
    <div class="cat-section-title" *ngIf="(categories$ | async) as cats">
      Mis categorías ({{ cats.length }})
    </div>

    <ng-container *ngIf="(categories$ | async) as cats">
      <div class="mf-card cat-list" *ngIf="cats.length > 0; else emptyCats">
        <div class="cat-item" *ngFor="let c of cats; let last = last" [class.last]="last">
          <div class="cat-bubble">{{ c.emoji || '🗂️' }}</div>
          <span class="cat-item-name">{{ c.name }}</span>
          <button class="cat-delete-btn" (click)="deleteCategory(c.id!, c.name)">🗑</button>
        </div>
      </div>
      <ng-template #emptyCats>
        <div class="cat-empty">
          <div class="cat-empty-icon">🗂️</div>
          <div class="cat-empty-text">Aún no hay categorías</div>
          <div class="cat-empty-sub">Crea tu primera categoría arriba</div>
        </div>
      </ng-template>
    </ng-container>

    <div style="height:40px"></div>
  </div>
</ion-content>
