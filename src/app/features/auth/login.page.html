<!-- login.page.html — MiBolsillo Dark Auth -->
<ion-content class="login-content">
  <div class="login-wrapper">

    <!-- Logo section -->
    <div class="login-brand">
      <div class="brand-logo">
        <img src="assets/icon/Mi Bolsillo2.png" alt="MiBolsillo" />
      </div>
      <h1 class="brand-name">MiBolsillo</h1>
      <p class="brand-tagline">Controla tus gastos con estilo</p>
    </div>

    <!-- Glass card -->
    <div class="login-card">

      <!-- Google button -->
      <button class="google-btn" (click)="continueWithGoogle()">
        <img class="google-icon" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
        <span>Continuar con Google</span>
      </button>

      <!-- Divider -->
      <div class="login-divider" *ngIf="recentUsers.length > 0">
        <span>Cuentas recientes</span>
      </div>

      <!-- Recent users -->
      <div class="recent-list" *ngIf="recentUsers.length > 0">
        <div class="recent-item" *ngFor="let u of recentUsers">
          <img class="recent-avatar" [src]="u.photoURL || 'assets/default-avatar.png'" alt="avatar" />
          <div class="recent-info">
            <div class="recent-name">{{ u.displayName || 'Usuario' }}</div>
            <div class="recent-email">{{ u.email }}</div>
          </div>
          <div class="recent-actions">
            <button class="btn-continue" (click)="continueWithRecent(u)">Continuar</button>
            <button class="btn-forget" (click)="forget(u)">✕</button>
          </div>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <p class="login-footer">Tus datos están protegidos con cifrado</p>

  </div>
</ion-content>
