<!-- onboarding.page.html -->
<ion-content class="onb-content" [fullscreen]="true">

  <!-- SPLASH -->
  <div class="splash" *ngIf="showSplash">
    <div class="splash__blob splash__blob--1"></div>
    <div class="splash__blob splash__blob--2"></div>
    <div class="splash__center">
      <div class="splash__logo">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
          <path d="M12 6v6l4 2"/>
        </svg>
      </div>
      <div class="splash__title">MiBolsillo</div>
      <div class="splash__sub">Tu dinero, bajo control.</div>
      <div class="splash__spinner"></div>
    </div>
    <div class="splash__version">v1.0.0</div>
  </div>

  <!-- ONBOARDING SLIDES -->
  <div class="onb-screen" *ngIf="!showSplash">

    <!-- Top nav -->
    <div class="onb-topbar">
      <button class="onb-back" *ngIf="currentIndex > 0" (click)="back()">← Atrás</button>
      <div *ngIf="currentIndex === 0"></div>
      <button class="onb-skip" (click)="skip()">Saltar</button>
    </div>

    <!-- Illustration -->
    <div class="onb-illust">

      <!-- BARS illustration -->
      <svg *ngIf="slide.illustration === 'bars'" viewBox="0 0 280 280" class="onb-svg">
        <defs>
          <linearGradient id="g1" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#7C3AED" stop-opacity="0.3"/>
            <stop offset="1" stop-color="#7C3AED"/>
          </linearGradient>
          <linearGradient id="g2" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#3B82F6" stop-opacity="0.3"/>
            <stop offset="1" stop-color="#3B82F6"/>
          </linearGradient>
        </defs>
        <ellipse cx="140" cy="224" rx="120" ry="18" fill="#7C3AED" opacity="0.15"/>
        <rect x="40" y="160" width="36" height="60" rx="8" fill="url(#g1)"/>
        <rect x="86" y="120" width="36" height="100" rx="8" fill="url(#g2)"/>
        <rect x="132" y="80" width="36" height="140" rx="8" fill="url(#g1)"/>
        <rect x="178" y="40" width="36" height="180" rx="8" fill="url(#g2)"/>
        <path d="M58 150 L104 110 L150 70 L196 30" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="196" cy="30" r="6" fill="#10B981"/>
        <circle cx="70" cy="60" r="14" fill="#F59E0B" opacity="0.9"/>
        <text x="70" y="65" text-anchor="middle" fill="#fff" font-weight="800" font-size="14">$</text>
        <circle cx="220" cy="100" r="11" fill="#10B981" opacity="0.9"/>
        <text x="220" y="104" text-anchor="middle" fill="#fff" font-weight="800" font-size="11">$</text>
      </svg>

      <!-- CARDS illustration -->
      <svg *ngIf="slide.illustration === 'cards'" viewBox="0 0 280 280" class="onb-svg">
        <defs>
          <linearGradient id="cd1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1E293B"/><stop offset="1" stop-color="#0F172A"/>
          </linearGradient>
          <linearGradient id="cd2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#3B82F6"/>
          </linearGradient>
        </defs>
        <ellipse cx="140" cy="240" rx="100" ry="14" fill="#3B82F6" opacity="0.2"/>
        <g transform="translate(50, 70) rotate(-8)">
          <rect width="160" height="100" rx="14" fill="url(#cd1)" stroke="rgba(255,255,255,0.1)"/>
          <rect x="14" y="20" width="24" height="18" rx="3" fill="#F59E0B"/>
          <text x="14" y="78" fill="#94A3B8" font-size="9" font-family="monospace">**** 4521</text>
        </g>
        <g transform="translate(80, 110) rotate(4)">
          <rect width="170" height="106" rx="14" fill="url(#cd2)"/>
          <rect width="170" height="106" rx="14" fill="rgba(255,255,255,0.08)"/>
          <rect x="14" y="20" width="26" height="20" rx="3" fill="#FBBF24"/>
          <text x="14" y="80" fill="#fff" font-size="11" font-family="monospace" font-weight="600">**** 8834</text>
          <text x="14" y="94" fill="rgba(255,255,255,0.7)" font-size="7">MI BOLSILLO</text>
        </g>
      </svg>

      <!-- LOANS illustration -->
      <svg *ngIf="slide.illustration === 'loans'" viewBox="0 0 280 280" class="onb-svg">
        <defs>
          <linearGradient id="ln1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#3B82F6"/>
          </linearGradient>
        </defs>
        <ellipse cx="140" cy="240" rx="90" ry="12" fill="#7C3AED" opacity="0.18"/>
        <circle cx="140" cy="130" r="70" fill="none" stroke="#2D2D44" stroke-width="20"/>
        <circle cx="140" cy="130" r="70" fill="none" stroke="url(#ln1)" stroke-width="20"
          stroke-dasharray="263 440" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90 140 130)"/>
        <text x="140" y="124" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">63%</text>
        <text x="140" y="148" text-anchor="middle" fill="#94A3B8" font-size="11">pagado</text>
        <g transform="translate(36, 180)">
          <rect width="44" height="44" rx="12" fill="#1A1A2E" stroke="#2D2D44"/>
          <text x="22" y="27" text-anchor="middle" fill="#10B981" font-size="18">🏦</text>
        </g>
        <g transform="translate(200, 180)">
          <rect width="44" height="44" rx="12" fill="#1A1A2E" stroke="#2D2D44"/>
          <text x="22" y="27" text-anchor="middle" fill="#3B82F6" font-size="18">🏦</text>
        </g>
      </svg>
    </div>

    <!-- Text -->
    <div class="onb-text">
      <h1 class="onb-title">{{ slide.title }}</h1>
      <p class="onb-subtitle">{{ slide.subtitle }}</p>
    </div>

    <!-- Dots + CTA -->
    <div class="onb-footer">
      <div class="onb-dots">
        <div class="onb-dot" *ngFor="let s of slides; let i = index" [class.active]="i === currentIndex"></div>
      </div>
      <button class="onb-cta" (click)="next()">{{ slide.cta }}</button>
    </div>

  </div>
</ion-content>
